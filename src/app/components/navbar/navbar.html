<header class="navbar" [class.navbar--scrolled]="isScrolled">
  <div class="navbar__inner">
    <a class="navbar__logo" href="/">
      <img src="images/vbot.png" alt="V-Bot" />
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="isMenuOpen">
      <a class="navbar__link" href="/" (click)="closeMenu()">Home</a>
      <a class="navbar__link" href="#res" (click)="closeMenu()">Resources</a>
      <a class="navbar__link" href="#shop" (click)="closeMenu()">Shopify</a>
      <a class="navbar__link" href="#price" (click)="closeMenu()">Pricing</a>
      <a class="navbar__link" href="#live-demo" (click)="closeMenu()">Scheduling — Live Demo</a>
      <a class="navbar__link" href="https://whatsapp.vflow.pro/login" target="_blank" rel="noopener noreferrer">Sign In</a>

      <!-- actions duplicated inside mobile menu -->
      <div class="navbar__mobile-actions">
        <a class="navbar__cta" href="https://play.google.com/store/apps/details?id=com.vbot.app&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">Download App</a>
      </div>
    </nav>

    <div class="navbar__actions">
      <a class="navbar__cta" href="https://play.google.com/store/apps/details?id=com.vbot.app&pcampaignid=web_share" target="_blank" rel="noopener noreferrer">Download App</a>
    </div>

    <button class="navbar__toggle" (click)="toggleMenu()" [class.navbar__toggle--active]="isMenuOpen" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
