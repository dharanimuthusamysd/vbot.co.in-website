<section  id="live-demo" class="live-demo">
  <div class="live-demo__grid">
    <div class="live-demo__visual">
      <img src="images/white.png" alt="V-Bot" />
    </div>

    <div class="live-demo__content">
      <span class="live-demo__eyebrow">See Vbot in Action</span>
      <h2>Schedule a <span class="accent">Live Demo</span></h2>
      <p>
        Watch a walkthrough of the real Vbot dashboard —
        campaigns, inbox, Shopify sync, and Leads CRM —
        or book a live session with our team.
      </p>
      <blockquote>
        "See exactly how your team would use Vbot day to day —
        no generic slides, just the real product."
      </blockquote>
     <button
  class="live-demo__cta"
  (click)="scheduleDemo()"
>
  Schedule a Live Demo
</button>
    </div>
  </div>
</section>
